  body { background:#f7f7f7; color:#111; min-height:100vh; display:flex; flex-direction:column; }

  /* Header */
  header {
    background:#fff; border-bottom:1px solid #e5e5e5;
    display:flex; align-items:center; justify-content:center;
    padding:14px 16px; position:relative;
  }
  .logo-row { display:flex; align-items:center; gap:10px; }
  .wa-icon {
    width:36px; height:36px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center;
  }
  .wa-icon svg { width:22px; height:22px; fill:#fff; }
  .brand-name { font-size:22px; font-weight:800; letter-spacing:-0.5px; }

  /* Main */
  main { flex:1; display:flex; flex-direction:column; align-items:center; padding:60px 20px 40px; }
  .avatar {
    width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4a6cf7, #1e2a78 70%);
    border:6px solid #25D366;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,.15);
  }
  .avatar svg { width:90px; height:90px; }
  h1 { margin-top:36px; font-size:26px; font-weight:500; letter-spacing:2px; color:#222; }
  .cta {
    margin-top:28px; display:inline-block;
    background:#128C7E; color:#fff; text-decoration:none;
    font-size:20px; padding:16px 70px; border-radius:18px;
    box-shadow:0 4px 12px rgba(18,140,126,.35);
    transition:transform .15s ease, background .15s ease;
  }
  .cta:hover { background:#075E54; transform:translateY(-2px); }
  .prefill { margin-top:48px; font-size:20px; color:#555; }

  /* Footer */
  footer {
    background:#111b21; color:#e9edef; padding:30px 20px 20px; text-align:center;
  }
  .footer-logo { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; font-size:15px; }
  .footer-logo svg { width:20px; height:20px; fill:#25D366; }
  .footer-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:14px 40px;
    max-width:560px; margin:0 auto; font-size:17px;
  }
  .footer-grid a { color:#e9edef; text-decoration:none; }
  .footer-grid a:hover { text-decoration:underline; }
  .copyright { margin-top:28px; font-size:12px; color:#8696a0; }
